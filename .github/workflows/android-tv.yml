name: APK Android TV

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Gerar APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk painel-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: painel-tv
          path: painel-tv.apk

      - name: Publicar versão (link fixo de download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-tv-v${{ github.run_number }}
          name: Painel TV (Android) 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: painel-tv.apk
          body: |
            App do Painel de Matrículas para Chromecast com Google TV / Android TV.

            Download direto na TV (app Downloader): **novasmatriculas.vercel.app/apk**
